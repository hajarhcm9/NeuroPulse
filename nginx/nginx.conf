events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:8001;
    }

    server {
        listen 8000;
        server_name _;

        client_max_body_size 10M;

        # API routes
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API docs
        location /api/docs {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            proxy_pass http://api;
        }

        # Root
        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }
    }
}