<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Guardian - Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #070B2B;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px; border-radius: 24px;
      background: rgba(123,97,255,0.15);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .icon svg { width: 40px; height: 40px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 15px; color: rgba(255,255,255,0.5); max-width: 300px; line-height: 1.6; }
    .btn {
      margin-top: 32px; padding: 14px 32px; border-radius: 16px;
      background: linear-gradient(135deg, #7B61FF, #9D8FFF);
      color: white; font-size: 16px; font-weight: 700;
      border: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#7B61FF" stroke-width="2">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>Vous etes hors ligne</h1>
  <p>Smart Guardian a besoin d'une connexion internet pour fonctionner. Verifiez votre connexion et reessayez.</p>
  <button class="btn" onclick="window.location.reload()">Reessayer</button>
</body>
</html>
